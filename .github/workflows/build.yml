name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Версия сборки, например v2.3.1. Тег создаётся при публикации релиза.'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version tag
        id: tag
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            echo "tag=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Notify build started via Telegram
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🔨 <b>Сборка начата</b> — ${TAG}%0A%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=HTML"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo docker image prune -af || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and build tools
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "build-tools;36.0.0" \
            "platforms;android-36"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cmake
          key: ndk-${{ hashFiles('TMessagesProj/jni/**') }}
          restore-keys: ndk-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Release APK
        run: ./gradlew :TMessagesProj_App:assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=512m"
          FORK_VERSION_TAG: ${{ steps.tag.outputs.tag }}

      - name: Publish GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"

          # Тестовые сборки (тег с третьим компонентом, например v2.3.1) публикуем как
          # prerelease: встроенный апдейтер читает /releases/latest, а GitHub никогда не
          # отдаёт туда prerelease, поэтому такая сборка не предлагается пользователям.
          # Обычные релизы (v2.4) остаются latest и обновление получают все.
          PRERELEASE=""
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            PRERELEASE="--prerelease"
            echo "$TAG looks like a test build — publishing as prerelease"
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading APK only, leaving notes/prerelease flag untouched"
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          else
            echo "No release for $TAG yet — creating with default notes"
            gh release create "$TAG" "$APK" \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              $PRERELEASE \
              --title "GramBas $TAG" \
              --notes "## GramBas — $TAG
          Переход на 13 версию приложения.
          Добавлен режим веб прокси.
          Видео сообщения переходят на Camera2 API (настройка в экспериментальных функциях).
          В профиле пользователей отображается ID.
          Обновлен wallet (доступен не на всех аккаунтах, управляется с сервера).
          Добавлено управление отображением рекламы в приложении во всех вариантах (в GramBas настройках).
          ⚠ Неофициальная сборка, не связана с Telegram FZ-LLC."
          fi

          echo "url=$(gh release view "$TAG" --repo "$REPO" --json url -q .url)" >> "$GITHUB_OUTPUT"

      - name: Send APK via Telegram
        run: |
          APK_PATH="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || echo 0)
          MAX_SIZE=$((50 * 1024 * 1024))  # 50 MB

          if [ "$APK_SIZE" -le "$MAX_SIZE" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F "document=@$APK_PATH" \
              -F "caption=✅ <b>GramBas ${{ steps.tag.outputs.tag }}</b> готов!%0A%0A• TLS ECH 0xfe0d%0A• Fingerprint: Chrome/Firefox/Safari/Edge/Random%0A• Фрагментация ClientHello" \
              -F "parse_mode=HTML"
          else
            RELEASE_URL="${{ steps.release.outputs.url }}"
            SIZE_MB=$(echo "scale=1; $APK_SIZE / 1048576" | bc)
            TEXT="✅ <b>GramBas ${{ steps.tag.outputs.tag }}</b> готов!%0A%0AAPK слишком большой для прямой отправки (${SIZE_MB} МБ).%0A%0A📥 <a href=\"$RELEASE_URL\">Скачать с GitHub Release</a>"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$TEXT" \
              -d "parse_mode=HTML"
          fi

      - name: Notify build failure via Telegram
        if: failure()
        run: |
          TEXT="❌ <b>Сборка упала</b> — ${{ steps.tag.outputs.tag }}%0A%0AПосмотри логи:%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=HTML"
